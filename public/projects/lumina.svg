<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="luminaBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1c1c"/>
      <stop offset="100%" stop-color="#121212"/>
    </linearGradient>
    <linearGradient id="cardGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a2a2a"/>
      <stop offset="100%" stop-color="#1f1f1f"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="800" height="500" fill="url(#luminaBg)" rx="16"/>
  <rect x="1" y="1" width="798" height="498" fill="none" stroke="#333333" stroke-width="1.5" rx="15"/>
  
  <!-- Subtle Grid -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="50" y1="0" x2="50" y2="500"/>
    <line x1="150" y1="0" x2="150" y2="500"/>
    <line x1="250" y1="0" x2="250" y2="500"/>
    <line x1="350" y1="0" x2="350" y2="500"/>
    <line x1="450" y1="0" x2="450" y2="500"/>
    <line x1="550" y1="0" x2="550" y2="500"/>
    <line x1="650" y1="0" x2="650" y2="500"/>
    <line x1="750" y1="0" x2="750" y2="500"/>
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
  </g>

  <!-- Browser/Window Mockup Top Bar -->
  <rect x="50" y="45" width="700" height="40" rx="8" fill="#222222" stroke="#333333" stroke-width="1"/>
  <circle cx="75" cy="65" r="5" fill="#555555"/>
  <circle cx="95" cy="65" r="5" fill="#444444"/>
  <circle cx="115" cy="65" r="5" fill="#444444"/>
  <rect x="150" y="55" width="280" height="20" rx="4" fill="#181818" stroke="#2e2e2e" stroke-width="1"/>
  <text x="165" y="69" font-family="monospace" font-size="10" fill="#777777">lumina.design-system.dev</text>

  <!-- Component Card 1: Buttons & Inputs -->
  <rect x="50" y="105" width="220" height="340" rx="10" fill="url(#cardGlow)" stroke="#333333" stroke-width="1"/>
  <text x="75" y="140" font-family="serif" font-size="16" fill="#ededed" font-style="italic">Primitives</text>
  <rect x="75" y="165" width="170" height="34" rx="17" fill="#ededed"/>
  <text x="160" y="187" font-family="sans-serif" font-size="11" fill="#171717" text-anchor="middle" font-weight="500">Action Button</text>
  
  <rect x="75" y="215" width="170" height="34" rx="6" fill="none" stroke="#444444" stroke-width="1.5"/>
  <text x="160" y="237" font-family="sans-serif" font-size="11" fill="#a3a3a3" text-anchor="middle">Ghost Input</text>

  <rect x="75" y="265" width="80" height="26" rx="13" fill="#2e2e2e"/>
  <rect x="165" y="265" width="80" height="26" rx="13" fill="#242424" stroke="#3a3a3a" stroke-width="1"/>

  <!-- Component Card 2: Typographic Scale Preview -->
  <rect x="290" y="105" width="460" height="340" rx="10" fill="url(#cardGlow)" stroke="#333333" stroke-width="1"/>
  <text x="320" y="145" font-family="sans-serif" font-size="11" letter-spacing="3" fill="#888888" text-transform="uppercase">Typography Token System</text>
  
  <text x="320" y="200" font-family="serif" font-size="34" fill="#ffffff" letter-spacing="-0.5">Aa Display Serif</text>
  <text x="320" y="235" font-family="sans-serif" font-size="16" fill="#bbbbbb">Geist Sans · Neutral scale tokens</text>

  <!-- Hairline Dividers & Metrics -->
  <line x1="320" y1="260" x2="710" y2="260" stroke="#333333" stroke-width="1"/>
  
  <g transform="translate(320, 280)">
    <rect x="0" y="0" width="115" height="135" rx="6" fill="#181818" stroke="#2c2c2c" stroke-width="1"/>
    <text x="15" y="30" font-family="monospace" font-size="11" fill="#777777">--bg-light</text>
    <rect x="15" y="45" width="85" height="60" rx="4" fill="#f7f7f5"/>
    <text x="57" y="120" font-family="monospace" font-size="9" fill="#888888" text-anchor="middle">#F7F7F5</text>
  </g>

  <g transform="translate(455, 280)">
    <rect x="0" y="0" width="115" height="135" rx="6" fill="#181818" stroke="#2c2c2c" stroke-width="1"/>
    <text x="15" y="30" font-family="monospace" font-size="11" fill="#777777">--bg-dark</text>
    <rect x="15" y="45" width="85" height="60" rx="4" fill="#111111" stroke="#333333" stroke-width="1"/>
    <text x="57" y="120" font-family="monospace" font-size="9" fill="#888888" text-anchor="middle">#111111</text>
  </g>

  <g transform="translate(590, 280)">
    <rect x="0" y="0" width="120" height="135" rx="6" fill="#181818" stroke="#2c2c2c" stroke-width="1"/>
    <text x="15" y="30" font-family="monospace" font-size="11" fill="#777777">--muted</text>
    <rect x="15" y="45" width="90" height="60" rx="4" fill="#737373"/>
    <text x="60" y="120" font-family="monospace" font-size="9" fill="#888888" text-anchor="middle">#737373</text>
  </g>
</svg>
