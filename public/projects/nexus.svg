<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="nexusBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141414"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#nexusBg)" rx="16"/>
  <rect x="1" y="1" width="798" height="498" fill="none" stroke="#2c2c2c" stroke-width="1.5" rx="15"/>

  <!-- Network / Topology Architecture Visual -->
  <g transform="translate(60, 50)">
    <!-- Inbound Gateway -->
    <rect x="0" y="150" width="130" height="80" rx="8" fill="#202020" stroke="#383838" stroke-width="1.5"/>
    <text x="65" y="185" font-family="sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="500">API Gateway</text>
    <text x="65" y="205" font-family="monospace" font-size="9" fill="#888888" text-anchor="middle">Port :443 / Envoy</text>

    <!-- Connectors -->
    <path d="M 130 190 L 220 100" stroke="#444444" stroke-width="1.5" stroke-dasharray="4 4" fill="none"/>
    <path d="M 130 190 L 220 190" stroke="#ededed" stroke-width="2" fill="none"/>
    <path d="M 130 190 L 220 280" stroke="#444444" stroke-width="1.5" stroke-dasharray="4 4" fill="none"/>

    <!-- Microservices Nodes -->
    <rect x="220" y="60" width="160" height="80" rx="8" fill="#1b1b1b" stroke="#333333" stroke-width="1"/>
    <text x="300" y="95" font-family="serif" font-size="15" fill="#ffffff" text-anchor="middle">Auth &amp; Session</text>
    <text x="300" y="115" font-family="monospace" font-size="9" fill="#888888" text-anchor="middle">JWT · Redis Shard</text>

    <rect x="220" y="150" width="160" height="80" rx="8" fill="#222222" stroke="#4f4f4f" stroke-width="1.5"/>
    <text x="300" y="185" font-family="serif" font-size="15" fill="#ffffff" text-anchor="middle">Core Engine</text>
    <text x="300" y="205" font-family="monospace" font-size="9" fill="#a3a3a3" text-anchor="middle">Go · gRPC Pipeline</text>

    <rect x="220" y="240" width="160" height="80" rx="8" fill="#1b1b1b" stroke="#333333" stroke-width="1"/>
    <text x="300" y="275" font-family="serif" font-size="15" fill="#ffffff" text-anchor="middle">Event Broker</text>
    <text x="300" y="295" font-family="monospace" font-size="9" fill="#888888" text-anchor="middle">Kafka Partition</text>

    <!-- Connectors to Storage -->
    <path d="M 380 190 L 470 190" stroke="#ededed" stroke-width="2" fill="none"/>

    <!-- Database / Analytics Layer -->
    <rect x="470" y="110" width="210" height="160" rx="10" fill="#1a1a1a" stroke="#333333" stroke-width="1"/>
    <text x="575" y="145" font-family="serif" font-size="17" fill="#ffffff" text-anchor="middle">Data Lake &amp; Cache</text>
    <line x1="490" y1="165" x2="660" y2="165" stroke="#2c2c2c" stroke-width="1"/>
    <text x="510" y="190" font-family="monospace" font-size="11" fill="#a3a3a3">PostgreSQL Multi-AZ</text>
    <text x="510" y="215" font-family="monospace" font-size="11" fill="#a3a3a3">Redis Cluster (Memory)</text>
    <text x="510" y="240" font-family="monospace" font-size="11" fill="#737373">Zero replication lag</text>
  </g>
</svg>
